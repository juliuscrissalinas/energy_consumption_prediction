[project]
name = "ec_prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "dagster",
    "dagster-cloud",
    "matplotlib>=3.9.4",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "ec_prediction.definitions"
project_name = "ec_prediction"

[tool.setuptools.packages.find]
exclude=["ec_prediction_tests"]
